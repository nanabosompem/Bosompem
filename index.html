<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0d14">
    <title>Bosompem Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Pro UI Elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Main Bosompem Personal Layer Overlay -->
    <div id="bosompem-root" class="bosompem-hud-layer">
        
        <!-- Header Controls & Engine Status -->
        <header class="hud-header">
            <div class="brand">
                <span class="pulse-ring"></span>
                <h1 class="glow-text">BOSOMPEM <span class="badge-pro">PRO</span></h1>
            </div>
            <div class="engine-telemetry">
                <span id="node-indicator" class="telemetry-badge edge"><i class="fa-solid fa-microchip"></i> EDGE</span>
                <span id="privacy-indicator" class="telemetry-badge secure"><i class="fa-solid fa-shield-halved"></i> ENCRYPTED</span>
            </div>
        </header>

        <!-- Main Conversational & Active Task Display -->
        <main class="hud-body">
            <div id="multimodal-viewport" class="viewport-container hidden">
                <video id="camera-stream" autoplay playsinline muted></video>
                <canvas id="vision-canvas" class="hidden"></canvas>
            </div>

            <div id="intent-stream" class="stream-container">
                <div class="system-card proactive-card hidden" id="proactive-card">
                    <div class="card-icon"><i class="fa-solid fa-bolt"></i></div>
                    <div class="card-content">
                        <span class="card-title">Proactive Suggestion</span>
                        <p id="proactive-text">Preparing routine sequence...</p>
                    </div>
                    <button id="btn-approve-proactive" class="btn-action">Execute</button>
                </div>

                <div id="chat-thread" class="chat-thread">
                    <!-- Dynamic Intent Execution Cards injected here -->
                </div>
            </div>
        </main>

        <!-- Dynamic Action Confirmation Modal -->
        <div id="confirmation-dialog" class="dialog-overlay hidden">
            <div class="dialog-card">
                <div class="dialog-header"><i class="fa-solid fa-triangle-exclamation"></i> Security Confirmation</div>
                <p id="dialog-message">Execute local task workflow?</p>
                <div class="dialog-actions">
                    <button id="btn-cancel-action" class="btn-secondary">Cancel</button>
                    <button id="btn-confirm-action" class="btn-danger">Confirm & Execute</button>
                </div>
            </div>
        </div>

        <!-- Input Interface Controller -->
        <footer class="hud-footer">
            <div class="multimodal-tools">
                <label for="file-input" class="tool-btn"><i class="fa-solid fa-paperclip"></i></label>
                <input type="file" id="file-input" multiple hidden>
                <button id="btn-camera" class="tool-btn"><i class="fa-solid fa-camera"></i></button>
                <button id="btn-config" class="tool-btn"><i class="fa-solid fa-sliders"></i></button>
            </div>

            <div class="input-bar">
                <textarea id="user-input" placeholder="Speak or type multi-step workflow..." rows="1"></textarea>
                <button id="btn-voice" class="mic-btn pulse"><i class="fa-solid fa-microphone"></i></button>
                <button id="btn-send" class="send-btn"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </footer>
    </div>

    <script src="app.js" type="module"></script>
</body>
</html>
