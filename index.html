<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bosompem AI</title>
  <!-- Import Lucide Icons Library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090a0f; color: #f3f4f6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #12151e; border-bottom: 1px solid #1f2937; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; }
    .title { font-weight: 700; font-size: 1.1rem; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .icon-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { color: #f3f4f6; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 88%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
    .message.user { align-self: flex-end; background: #1e1b4b; color: #e0e7ff; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #131722; border: 1px solid #1f2937; border-bottom-left-radius: 4px; }
    .message.system { align-self: center; background: rgba(239, 68, 68, 0.1); color: #ef4444; font-size: 0.85rem; border: 1px solid rgba(239, 68, 68, 0.2); }

    .thinking { align-self: flex-start; font-style: italic; color: #9ca3af; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .dots { display: inline-block; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

    #settings-panel { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #090a0f; z-index: 100; padding: 20px; overflow-y: auto; }
    #settings-panel.active { display: block; }
    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 6px; }
    .setting-group input, .setting-group select { width: 100%; padding: 12px; background: #12151e; border: 1px solid #1f2937; color: #f3f4f6; border-radius: 8px; outline: none; }

    footer { padding: 12px; background: #12151e; border-top: 1px solid #1f2937; display: flex; gap: 8px; align-items: center; position: sticky; bottom: 0; }
    input[type="text"] { flex: 1; padding: 12px 16px; background: #090a0f; border: 1px solid #1f2937; color: #f3f4f6; border-radius: 24px; outline: none; font-size: 1rem; }
    input[type="text"]:focus { border-color: #6366f1; }
    
    .action-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #6366f1; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .action-btn.recording { background: #ec4899; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="status-indicator" class="status-dot"></div>
      <span class="title">Bosompem AI</span>
    </div>
    <div class="header-actions">
      <button id="tts-toggle" class="icon-btn" onclick="toggleAudio()" title="Toggle Speech">
        <i data-lucide="volume-2"></i>
      </button>
      <button class="icon-btn" onclick="toggleSettings()" title="Settings">
        <i data-lucide="settings"></i>
      </button>
    </div>
  </header>

  <main id="chat-container">
    <div class="message assistant">
      Welcome. I am <strong>Bosompem</strong>, your intelligent AI assistant. How may I assist you today?
    </div>
  </main>

  <div id="settings-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2>Settings</h2>
      <button class="icon-btn" onclick="toggleSettings()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="setting-group">
      <label for="api-key">Gemini API Key</label>
      <input type="text" id="api-key" placeholder="Paste your API key here" />
    </div>
    <div class="setting-group">
      <label for="model-select">Primary Model</label>
      <select id="model-select">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
      </select>
    </div>
    <button style="width: 100%; padding: 12px; background: #6366f1; border: none; color: white; border-radius: 8px; font-weight: 600;" onclick="saveSettings()">Save Configuration</button>
  </div>

  <footer>
    <button id="mic-btn" class="action-btn" style="background: #12151e; border: 1px solid #1f2937;" onclick="toggleVoiceInput()">
      <i data-lucide="mic"></i>
    </button>
    <input type="text" id="user-input" placeholder="Type a message or speak..." onkeypress="handleKeyPress(event)" />
    <button id="send-btn" class="action-btn" onclick="sendMessage()">
      <i data-lucide="send"></i>
    </button>
  </footer>

  <script>
    const PROMPT_PREFIX = "Instructions: You are Bosompem, an elite AI assistant. Keep all responses direct, concise, polite, clear, and professional.\n\nUser Question: ";

    const state = {
      apiKey: localStorage.getItem('bosompem_api_key') || '',
      model: localStorage.getItem('bosompem_model') || 'gemini-2.5-flash',
      speechEnabled: localStorage.getItem('bosompem_speech') !== 'false',
      history: []
    };

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const statusIndicator = document.getElementById('status-indicator');
    const apiKeyInput = document.getElementById('api-key');
    const modelSelect = document.getElementById('model-select');
    const ttsToggle = document.getElementById('tts-toggle');
    const micBtn = document.getElementById('mic-btn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.onstart = () => micBtn.classList.add('recording');
      recognition.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
        sendMessage();
      };
      recognition.onend = () => micBtn.classList.remove('recording');
    }

    window.addEventListener('DOMContentLoaded', () => {
      apiKeyInput.value = state.apiKey;
      modelSelect.value = state.model;
      updateTtsIcon();
      updateStatus();
      if (window.lucide) lucide.createIcons();
    });

    function updateStatus() {
      if (state.apiKey && state.apiKey.length > 10) {
        statusIndicator.classList.add('active');
      } else {
        statusIndicator.classList.remove('active');
      }
    }

    function toggleAudio() {
      state.speechEnabled = !state.speechEnabled;
      localStorage.setItem('bosompem_speech', state.speechEnabled);
      if (!state.speechEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      updateTtsIcon();
    }

    function updateTtsIcon() {
      ttsToggle.innerHTML = state.speechEnabled ? '<i data-lucide="volume-2"></i>' : '<i data-lucide="volume-x"></i>';
      if (window.lucide) lucide.createIcons();
    }

    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('active');
    }

    function saveSettings() {
      state.apiKey = apiKeyInput.value.trim();
      state.model = modelSelect.value;
      localStorage.setItem('bosompem_api_key', state.apiKey);
      localStorage.setItem('bosompem_model', state.model);
      updateStatus();
      toggleSettings();
      appendMessage('system', 'Configuration saved.');
    }

    function appendMessage(role, text) {
      const msgNode = document.createElement('div');
      msgNode.className = `message ${role}`;
      msgNode.innerHTML = text;
      chatContainer.appendChild(msgNode);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgNode;
    }

    function speakText(text) {
      if (!state.speechEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/<[^>]*>/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoiceInput() {
      if (!SpeechRecognition) return alert('Speech recognition is not supported in this browser.');
      recognition.start();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function callGemini(modelName, formattedContents) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(state.apiKey)}`;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: formattedContents,
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 600
          }
        })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP ${res.status}`);
      }

      return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      if (!state.apiKey) return appendMessage('system', 'Please enter your API Key in Settings first.');

      appendMessage('user', text);
      userInput.value = '';

      if (state.history.length > 6) {
        state.history = state.history.slice(-6);
      }

      const promptText = state.history.length === 0 ? `${PROMPT_PREFIX}${text}` : text;
      state.history.push({ role: 'user', parts: [{ text: promptText }] });

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      const thinkingNode = document.createElement('div');
      thinkingNode.className = 'thinking';
      thinkingNode.innerHTML = `<span>Thinking</span><span class="dots">...</span>`;
      chatContainer.appendChild(thinkingNode);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        let reply = '';
        try {
          reply = await callGemini(state.model, state.history);
        } catch (err1) {
          const fallback = state.model === 'gemini-2.5-flash' ? 'gemini-2.5-flash-lite' : 'gemini-2.5-flash';
          reply = await callGemini(fallback, state.history);
        }

        if (chatContainer.contains(thinkingNode)) {
          chatContainer.removeChild(thinkingNode);
        }

        appendMessage('assistant', reply);
        speakText(reply);
        state.history.push({ role: 'model', parts: [{ text: reply }] });

      } catch (err) {
        if (chatContainer.contains(thinkingNode)) chatContainer.removeChild(thinkingNode);
        appendMessage('system', `API Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
