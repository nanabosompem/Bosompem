<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bosompem AI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    html, body {
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at top right, #1a1d2d, #0b0d14);
      color: #f3f4f6;
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }

    /* Glass Elements */
    .glass-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      color: #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); color: #ffffff; }

    /* Custom Header Menu Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(15, 18, 28, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; transition: background 0.3s; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
    .title { font-weight: 600; font-size: 1.05rem; letter-spacing: 0.4px; color: #ffffff; }

    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; font-size: 0.95rem; }

    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message-wrapper { display: flex; flex-direction: column; gap: 6px; max-width: 90%; }
    .message-wrapper.user { align-self: flex-end; }
    .message-wrapper.assistant { align-self: flex-start; }

    .message {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .message.user {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(79, 70, 229, 0.95));
      color: #ffffff;
      border-bottom-right-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .message.assistant {
      background: rgba(22, 27, 40, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d1d5db;
      border-bottom-left-radius: 4px;
    }
    .message.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      font-size: 0.85rem;
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 20px;
      padding: 8px 16px;
    }

    .attached-preview-img, .generated-img {
      max-width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); margin-top: 8px; display: block;
    }

    .msg-actions { display: flex; gap: 10px; align-items: center; padding-left: 4px; }
    .msg-action-btn { background: transparent; border: none; color: #6b7280; cursor: pointer; font-size: 0.85rem; }

    /* Modals */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 13, 20, 0.85); backdrop-filter: blur(16px);
      z-index: 100; padding: 24px; overflow-y: auto;
    }
    .modal-overlay.active { display: block; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }

    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 8px; }
    .setting-group input, .setting-group select {
      width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12); color: #f3f4f6; border-radius: 10px; outline: none;
    }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .gallery-item { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12); aspect-ratio: 1; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Footer & Input Bar */
    footer {
      padding: 12px 16px; background: rgba(15, 18, 28, 0.7);
      backdrop-filter: blur(16px); border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
    }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    .input-wrapper { flex: 1; display: flex; align-items: center; }
    input[type="text"] {
      width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12); color: #f3f4f6; border-radius: 24px; outline: none;
    }

    .action-btn { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }

    .live-mode-btn {
      padding: 0 14px; height: 42px; border-radius: 21px; font-size: 0.85rem;
      font-weight: 600; gap: 6px; background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3); color: #818cf8; flex-shrink: 0;
    }
    .live-mode-btn.active {
      background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color: #10b981;
    }

    /* Visual Indicator for Active Voice Listening */
    .listening-bar {
      display: none; align-items: center; justify-content: center; gap: 6px;
      padding: 8px; background: rgba(16, 185, 129, 0.12); border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; font-size: 0.85rem; font-weight: 500;
    }
    .listening-bar.active { display: flex; }
    .wave-bar { width: 4px; height: 16px; background: #10b981; border-radius: 2px; animation: wave 1s infinite ease-in-out; }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 20px; } }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="glass-btn icon-btn" onclick="toggleSidebar()" title="Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="brand">
        <div id="status-indicator" class="status-dot"></div>
        <span class="title">Bosompem AI</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="glass-btn icon-btn" onclick="toggleGallery()" title="Image Gallery">
        <i class="fa-regular fa-images"></i>
      </button>
      <button id="tts-toggle" class="glass-btn icon-btn" onclick="toggleAudio()" title="Toggle Speech">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="glass-btn icon-btn" onclick="toggleSettings()" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <main id="chat-container">
    <div class="message-wrapper assistant">
      <div class="message assistant">
        Hello! I am <strong>Bosompem AI</strong>. Configure your Gemini API key in ⚙️ <strong>Settings</strong>, or tap <strong>LIVE</strong> to begin voice interaction. You can ask me to generate or edit photos directly!
      </div>
    </div>
  </main>

  <div id="listening-indicator" class="listening-bar">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <span style="margin-left: 8px;">Bosompem is listening...</span>
  </div>

  <div id="gallery-panel" class="modal-overlay">
    <div class="modal-header">
      <h2>Image Library</h2>
      <button class="glass-btn icon-btn" onclick="toggleGallery()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="gallery-container" class="gallery-grid">
      <p style="color: #9ca3af; grid-column: 1/-1;">No saved images yet.</p>
    </div>
  </div>

  <div id="settings-panel" class="modal-overlay">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="glass-btn icon-btn" onclick="toggleSettings()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="setting-group">
      <label for="api-key">Gemini API Key</label>
      <input type="text" id="api-key" placeholder="Paste your API key here" />
    </div>
    <div class="setting-group">
      <label for="model-select">Primary Model</label>
      <select id="model-select">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Recommended)</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Fastest)</option>
      </select>
    </div>
    <div class="setting-group">
      <label for="speaker-select">Voice Speaker Accent</label>
      <select id="speaker-select"></select>
    </div>
    <div class="setting-group">
      <label for="speed-select">Talking Speed (<span id="speed-val">1.0</span>x)</label>
      <input type="range" id="speed-select" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('speed-val').innerText = this.value" />
    </div>
    <button class="glass-btn" style="width: 100%; padding: 12px; background: rgba(99, 102, 241, 0.4); border-color: rgba(99, 102, 241, 0.5); border-radius: 10px; font-weight: 600;" onclick="saveSettings()">Save Configuration</button>
  </div>

  <footer>
    <div id="attachment-preview" style="display: none; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);">
      <img id="preview-thumb" style="width: 36px; height: 36px; border-radius: 6px; object-fit: cover;" src="" alt="preview" />
      <span style="font-size: 0.85rem; flex: 1; color: #d1d5db;" id="attachment-name">Image attached</span>
      <button class="glass-btn icon-btn" onclick="clearAttachment()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="input-bar">
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelected(event)" />
      
      <button class="glass-btn icon-btn" style="width: 42px; height: 42px; border-radius: 50%; color: #818cf8;" onclick="document.getElementById('file-input').click()" title="Upload Image to Edit/Analyze">
        <i class="fa-solid fa-paperclip"></i>
      </button>

      <button id="live-btn" class="glass-btn live-mode-btn" onclick="toggleLiveMode()" title="Talk Live to AI">
        <i class="fa-solid fa-headset"></i>
        <span>LIVE</span>
      </button>

      <div class="input-wrapper">
        <input type="text" id="user-input" placeholder="Ask anything, or edit/create an image..." onkeypress="handleKeyPress(event)" />
      </div>

      <button id="mic-btn" class="glass-btn action-btn" onclick="toggleVoiceInput()" title="Voice Input">
        <i class="fa-solid fa-microphone"></i>
      </button>

      <button id="send-btn" class="glass-btn action-btn" style="background: rgba(99, 102, 241, 0.5); border-color: rgba(99, 102, 241, 0.6);" onclick="sendMessage()" title="Send">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
