<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bosompem AI</title>
  <meta name="theme-color" content="#090a0f" />
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Bosompem%22,%22short_name%22:%22Bosompem%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23090a0f%22,%22theme_color%22:%22%23090a0f%22}" />
  <style>
    :root {
      --bg: #090a0f;
      --card: #12151e;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --border: #1f2937;
      --user-msg: #1e1b4b;
      --ai-msg: #131722;
      --error: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); transition: background 0.3s; }
    .status-dot.active { background: var(--success); }
    .title { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px; }
    .icon-btn { background: transparent; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; padding: 4px; }

    /* Chat Area */
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .message.user { align-self: flex-end; background: var(--user-msg); border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: var(--ai-msg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .message.system { align-self: center; background: rgba(239, 68, 68, 0.1); color: var(--error); font-size: 0.85rem; border: 1px solid rgba(239, 68, 68, 0.2); }

    /* Control Panel / Settings */
    #settings-panel { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 100; padding: 20px; overflow-y: auto; }
    #settings-panel.active { display: block; }
    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
    .setting-group input, .setting-group select { width: 100%; padding: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; }

    /* Input Bar */
    footer { padding: 12px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 24px; outline: none; font-size: 1rem; }
    input[type="text"]:focus { border-color: var(--accent); }
    .action-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; box-shadow: 0 0 12px var(--accent-glow); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="status-indicator" class="status-dot"></div>
      <span class="title">Bosompem</span>
    </div>
    <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
  </header>

  <main id="chat-container">
    <div class="message assistant">
      Greetings. I am <strong>Bosompem</strong>. Configure your free API Key in Settings to get started.
    </div>
  </main>

  <div id="settings-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2>Settings</h2>
      <button class="icon-btn" onclick="toggleSettings()">❌</button>
    </div>
    <div class="setting-group">
      <label for="api-key">Gemini API Key (Free Tier)</label>
      <input type="password" id="api-key" placeholder="AIzaSy..." />
    </div>
    <div class="setting-group">
      <label for="model-select">AI Model</label>
      <select id="model-select">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fastest / Recommended)</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fallback)</option>
      </select>
    </div>
    <button style="width: 100%; padding: 12px; background: var(--accent); border: none; color: white; border-radius: 8px; font-weight: 600;" onclick="saveSettings()">Save Configuration</button>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="Speak or type a command..." onkeypress="handleKeyPress(event)" />
    <button id="send-btn" class="action-btn" onclick="sendMessage()">➔</button>
  </footer>

  <script>
    // State Engine
    const state = {
      apiKey: localStorage.getItem('bosompem_api_key') || '',
      model: localStorage.getItem('bosompem_model') || 'gemini-2.5-flash',
      history: []
    };

    const SYSTEM_PROMPT = "You are Bosompem, a personal AI assistant on an Android device. Be intelligent, calm, direct, and helpful. Avoid robotic phrasing.";

    // UI Nodes
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const statusIndicator = document.getElementById('status-indicator');
    const apiKeyInput = document.getElementById('api-key');

    // Init Logic
    window.addEventListener('DOMContentLoaded', () => {
      apiKeyInput.value = state.apiKey;
      updateStatus();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => console.log('PWA ServiceWorker ready'));
      }
    });

    function updateStatus() {
      if (state.apiKey && state.apiKey.length > 10) {
        statusIndicator.classList.add('active');
      } else {
        statusIndicator.classList.remove('active');
      }
    }

    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('active');
    }

    function saveSettings() {
      state.apiKey = apiKeyInput.value.trim();
      state.model = document.getElementById('model-select').value;
      localStorage.setItem('bosompem_api_key', state.apiKey);
      localStorage.setItem('bosompem_model', state.model);
      updateStatus();
      toggleSettings();
      appendMessage('system', 'Configuration saved.');
    }

    function appendMessage(role, text) {
      const msgNode = document.createElement('div');
      msgNode.className = `message ${role}`;
      msgNode.innerHTML = text;
      chatContainer.appendChild(msgNode);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!state.apiKey) {
        appendMessage('system', 'Please add your Gemini API Key in Settings first.');
        return;
      }

      appendMessage('user', text);
      userInput.value = '';
      state.history.push({ role: 'user', parts: [{ text }] });

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      try {
        const responseText = await callGeminiAPI();
        appendMessage('assistant', responseText);
        state.history.push({ role: 'model', parts: [{ text: responseText }] });
      } catch (err) {
        appendMessage('system', err.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    async function callGeminiAPI() {
      if (!navigator.onLine) {
        throw new Error('Network offline. Check your internet connection.');
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`;
      const payload = {
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: state.history
      };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        if (res.status === 400) throw new Error('Invalid API Key format or bad request payload.');
        if (res.status === 429) throw new Error('Quota exceeded. Rate limit reached for this free key.');
        throw new Error(`API Error [${res.status}]: ${errData.error?.message || 'Server connection failed'}`);
      }

      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response returned from model.';
    }
  </script>
</body>
  </html>
