<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bosompem AI</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090a0f; color: #f3f4f6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #12151e; border-bottom: 1px solid #1f2937; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; }
    .title { font-weight: 700; font-size: 1.1rem; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .icon-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { color: #f3f4f6; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    
    .message-wrapper { display: flex; flex-direction: column; gap: 6px; max-width: 88%; }
    .message-wrapper.user { align-self: flex-end; }
    .message-wrapper.assistant { align-self: flex-start; }

    .message { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .message.user { background: #1e1b4b; color: #e0e7ff; border-bottom-right-radius: 4px; }
    .message.assistant { background: #131722; border: 1px solid #1f2937; border-bottom-left-radius: 4px; }
    .message.system { align-self: center; background: rgba(239, 68, 68, 0.1); color: #ef4444; font-size: 0.85rem; border: 1px solid rgba(239, 68, 68, 0.2); }

    .attached-preview-img { max-width: 200px; border-radius: 8px; margin-bottom: 6px; display: block; }
    .generated-img { width: 100%; max-width: 380px; border-radius: 12px; border: 1px solid #1f2937; margin-top: 8px; cursor: pointer; }

    .msg-actions { display: flex; gap: 10px; align-items: center; padding-left: 4px; }
    .msg-action-btn { background: transparent; border: none; color: #6b7280; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 4px; }
    .msg-action-btn:hover { color: #f3f4f6; }
    .msg-action-btn.liked { color: #10b981; }
    .msg-action-btn.disliked { color: #ef4444; }

    .thinking { align-self: flex-start; font-style: italic; color: #9ca3af; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .dots { display: inline-block; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

    /* Modals & Overlay Panels */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #090a0f; z-index: 100; padding: 20px; overflow-y: auto; }
    .modal-overlay.active { display: block; }

    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 6px; }
    .setting-group input, .setting-group select { width: 100%; padding: 12px; background: #12151e; border: 1px solid #1f2937; color: #f3f4f6; border-radius: 8px; outline: none; }

    /* Gallery Grid */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .gallery-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #1f2937; aspect-ratio: 1; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Footer & Attachments */
    footer { padding: 12px; background: #12151e; border-top: 1px solid #1f2937; display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: 0; flex-shrink: 0; }
    .input-bar { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 12px 16px; background: #090a0f; border: 1px solid #1f2937; color: #f3f4f6; border-radius: 24px; outline: none; font-size: 1rem; }
    input[type="text"]:focus { border-color: #6366f1; }
    
    .attachment-preview-bar { display: none; align-items: center; gap: 8px; background: #131722; padding: 8px 12px; border-radius: 8px; border: 1px solid #1f2937; }
    .attachment-preview-bar.active { display: flex; }
    .attachment-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }

    .action-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #6366f1; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .action-btn.live-active { background: #10b981; animation: pulse 1.5s infinite; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="status-indicator" class="status-dot"></div>
      <span class="title">Bosompem AI</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleLiveMode()" id="live-btn" title="Live Voice Mode">
        <i data-lucide="radio"></i>
      </button>
      <button class="icon-btn" onclick="toggleGallery()" title="Image Library">
        <i data-lucide="image"></i>
      </button>
      <button id="tts-toggle" class="icon-btn" onclick="toggleAudio()" title="Toggle Speech">
        <i data-lucide="volume-2"></i>
      </button>
      <button class="icon-btn" onclick="toggleSettings()" title="Settings">
        <i data-lucide="settings"></i>
      </button>
    </div>
  </header>

  <main id="chat-container">
    <div class="message-wrapper assistant">
      <div class="message assistant">
        Welcome! I am <strong>Bosompem</strong>. I can chat live with voice, analyze camera photos/files, and generate images. How can I help you today?
      </div>
    </div>
  </main>

  <!-- Gallery Library Modal -->
  <div id="gallery-panel" class="modal-overlay">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2>Image Library</h2>
      <button class="icon-btn" onclick="toggleGallery()"><i data-lucide="x"></i></button>
    </div>
    <div id="gallery-container" class="gallery-grid">
      <p style="color: #9ca3af; grid-column: 1/-1;">No generated images saved yet.</p>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-panel" class="modal-overlay">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2>Settings</h2>
      <button class="icon-btn" onclick="toggleSettings()"><i data-lucide="x"></i></button>
    </div>
    <div class="setting-group">
      <label for="api-key">Gemini API Key</label>
      <input type="text" id="api-key" placeholder="Paste your API key here" />
    </div>
    <div class="setting-group">
      <label for="model-select">Primary Model</label>
      <select id="model-select">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Recommended)</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
      </select>
    </div>
    <button style="width: 100%; padding: 12px; background: #6366f1; border: none; color: white; border-radius: 8px; font-weight: 600;" onclick="saveSettings()">Save Configuration</button>
  </div>

  <footer>
    <div id="attachment-preview" class="attachment-preview-bar">
      <img id="preview-thumb" class="attachment-thumb" src="" alt="attachment preview" />
      <span style="font-size: 0.85rem; flex: 1;" id="attachment-name">Image attached</span>
      <button class="icon-btn" onclick="clearAttachment()"><i data-lucide="x"></i></button>
    </div>

    <div class="input-bar">
      <input type="file" id="file-input" accept="image/*,.pdf,.txt" style="display: none;" onchange="handleFileSelected(event)" />
      <button class="icon-btn" style="color: #6366f1;" onclick="document.getElementById('file-input').click()" title="Upload Image / File">
        <i data-lucide="paperclip"></i>
      </button>

      <input type="text" id="user-input" placeholder="Type a message, attach file, or speak..." onkeypress="handleKeyPress(event)" />

      <button id="mic-btn" class="action-btn" style="background: #12151e; border: 1px solid #1f2937;" onclick="toggleVoiceInput()">
        <i data-lucide="mic"></i>
      </button>
      
      <button id="send-btn" class="action-btn" onclick="sendMessage()">
        <i data-lucide="send"></i>
      </button>
    </div>
  </footer>

  <script>
    const PROMPT_PREFIX = "Instructions: You are Bosompem, an intelligent AI assistant. Provide thorough, clear, and concise answers.\n\nUser Question: ";

    const state = {
      apiKey: localStorage.getItem('bosompem_api_key') || '',
      model: localStorage.getItem('bosompem_model') || 'gemini-3.5-flash-lite',
      speechEnabled: localStorage.getItem('bosompem_speech') !== 'false',
      liveMode: false,
      history: [],
      gallery: JSON.parse(localStorage.getItem('bosompem_gallery') || '[]'),
      attachedImage: null // { base64: '', mimeType: '', previewUrl: '' }
    };

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const statusIndicator = document.getElementById('status-indicator');
    const apiKeyInput = document.getElementById('api-key');
    const modelSelect = document.getElementById('model-select');
    const ttsToggle = document.getElementById('tts-toggle');
    const micBtn = document.getElementById('mic-btn');
    const liveBtn = document.getElementById('live-btn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.onstart = () => micBtn.classList.add('recording');
      recognition.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
        sendMessage();
      };
      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      apiKeyInput.value = state.apiKey;
      modelSelect.value = state.model;
      updateTtsIcon();
      updateStatus();
      renderGallery();
      if (window.lucide) lucide.createIcons();
    });

    function scrollToBottom() {
      setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
    }

    function updateStatus() {
      if (state.apiKey && state.apiKey.length > 10) statusIndicator.classList.add('active');
      else statusIndicator.classList.remove('active');
    }

    function toggleAudio() {
      state.speechEnabled = !state.speechEnabled;
      localStorage.setItem('bosompem_speech', state.speechEnabled);
      if (!state.speechEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
      updateTtsIcon();
    }

    function updateTtsIcon() {
      ttsToggle.innerHTML = state.speechEnabled ? '<i data-lucide="volume-2"></i>' : '<i data-lucide="volume-x"></i>';
      if (window.lucide) lucide.createIcons();
    }

    function toggleSettings() { document.getElementById('settings-panel').classList.toggle('active'); }
    function toggleGallery() { 
      renderGallery();
      document.getElementById('gallery-panel').classList.toggle('active'); 
    }

    function toggleLiveMode() {
      state.liveMode = !state.liveMode;
      liveBtn.classList.toggle('live-active', state.liveMode);
      if (state.liveMode) {
        state.speechEnabled = true;
        updateTtsIcon();
        appendSystemMessage("Live Voice Mode activated. Speak freely!");
        if (SpeechRecognition) recognition.start();
      } else {
        appendSystemMessage("Live Voice Mode deactivated.");
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function saveSettings() {
      state.apiKey = apiKeyInput.value.trim();
      state.model = modelSelect.value;
      localStorage.setItem('bosompem_api_key', state.apiKey);
      localStorage.setItem('bosompem_model', state.model);
      updateStatus();
      toggleSettings();
      appendSystemMessage('Configuration saved.');
    }

    // Attachment Handler
    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64Data = e.target.result.split(',')[1];
        state.attachedImage = {
          base64: base64Data,
          mimeType: file.type || 'image/jpeg',
          previewUrl: e.target.result,
          name: file.name
        };

        document.getElementById('preview-thumb').src = e.target.result;
        document.getElementById('attachment-name').innerText = file.name;
        document.getElementById('attachment-preview').classList.add('active');
      };
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      state.attachedImage = null;
      document.getElementById('file-input').value = '';
      document.getElementById('attachment-preview').classList.remove('active');
    }

    function appendSystemMessage(text) {
      const msgNode = document.createElement('div');
      msgNode.className = 'message system';
      msgNode.innerText = text;
      chatContainer.appendChild(msgNode);
      scrollToBottom();
    }

    function appendUserMessage(text, attachedImg = null) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper user';

      const msg = document.createElement('div');
      msg.className = 'message user';

      if (attachedImg) {
        const img = document.createElement('img');
        img.src = attachedImg.previewUrl;
        img.className = 'attached-preview-img';
        msg.appendChild(img);
      }

      if (text) {
        const textSpan = document.createElement('span');
        textSpan.innerText = text;
        msg.appendChild(textSpan);
      }

      wrapper.appendChild(msg);
      chatContainer.appendChild(wrapper);
      scrollToBottom();
    }

    function appendAssistantMessage(text, imageUrl = null) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper assistant';

      const msg = document.createElement('div');
      msg.className = 'message assistant';
      msg.innerHTML = text;

      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.className = 'generated-img';
        img.alt = 'Generated Image';
        img.onload = () => scrollToBottom();
        msg.appendChild(img);
        saveToGallery(imageUrl);
      }

      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      actions.innerHTML = `
        <button class="msg-action-btn" onclick="toggleLike(this, 'like')" title="Like"><i data-lucide="thumbs-up"></i></button>
        <button class="msg-action-btn" onclick="toggleLike(this, 'dislike')" title="Dislike"><i data-lucide="thumbs-down"></i></button>
        <button class="msg-action-btn" onclick="copyMessageText(this)" title="Copy"><i data-lucide="copy"></i></button>
        <button class="msg-action-btn" onclick="shareMessageText(this)" title="Share"><i data-lucide="share-2"></i></button>
      `;

      wrapper.appendChild(msg);
      wrapper.appendChild(actions);
      chatContainer.appendChild(wrapper);

      if (window.lucide) lucide.createIcons();
      scrollToBottom();
    }

    function saveToGallery(url) {
      state.gallery.unshift({ url, timestamp: new Date().toISOString() });
      localStorage.setItem('bosompem_gallery', JSON.stringify(state.gallery));
    }

    function renderGallery() {
      const container = document.getElementById('gallery-container');
      if (state.gallery.length === 0) {
        container.innerHTML = `<p style="color: #9ca3af; grid-column: 1/-1;">No generated images saved yet.</p>`;
        return;
      }

      container.innerHTML = state.gallery.map(item => `
        <div class="gallery-item">
          <a href="${item.url}" target="_blank">
            <img src="${item.url}" alt="Saved AI Image" />
          </a>
        </div>
      `).join('');
    }

    function toggleLike(btn, type) {
      const parent = btn.parentElement;
      if (type === 'like') {
        parent.children[0].classList.toggle('liked');
        parent.children[1].classList.remove('disliked');
      } else {
        parent.children[1].classList.toggle('disliked');
        parent.children[0].classList.remove('liked');
      }
    }

    function copyMessageText(btn) {
      const msgText = btn.closest('.message-wrapper').querySelector('.message').innerText;
      navigator.clipboard.writeText(msgText).then(() => alert('Copied to clipboard!'));
    }

    function shareMessageText(btn) {
      const msgText = btn.closest('.message-wrapper').querySelector('.message').innerText;
      if (navigator.share) {
        navigator.share({ title: 'Bosompem AI Response', text: msgText }).catch(() => {});
      } else {
        copyMessageText(btn);
      }
    }

    function speakText(text, onComplete = null) {
      if (!state.speechEnabled || !('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/<[^>]*>/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.onend = () => {
        if (onComplete) onComplete();
      };
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoiceInput() {
      if (!SpeechRecognition) return alert('Speech recognition is not supported in this browser.');
      recognition.start();
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    function isImageRequest(text) {
      const triggerWords = ['generate image', 'create an image', 'draw', 'generate an image', 'show me a picture of'];
      return triggerWords.some(word => text.toLowerCase().includes(word));
    }

    async function callGemini(modelName, formattedContents) {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(state.apiKey)}`;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: formattedContents,
          generationConfig: { temperature: 0.7 }
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);

      return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      const attached = state.attachedImage;

      if (!text && !attached) return;

      appendUserMessage(text, attached);
      userInput.value = '';
      clearAttachment();

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      const thinkingNode = document.createElement('div');
      thinkingNode.className = 'thinking';
      thinkingNode.innerHTML = `<span>Thinking</span><span class="dots">...</span>`;
      chatContainer.appendChild(thinkingNode);
      scrollToBottom();

      // Image generation trigger
      if (text && isImageRequest(text)) {
        try {
          const encodedPrompt = encodeURIComponent(text);
          const imageUrl = `https://image.pollinations.ai/prompt/${encodedPro
