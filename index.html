<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bosompem AI</title>
  
  <!-- Font Awesome Vector Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Marked.js for Rendering Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    html, body {
      height: 100%;
      height: 100dvh;
      background: radial-gradient(circle at top right, #1a1d2d, #0b0d14);
      color: #f3f4f6;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphic Base Style for Premium Glass Buttons & Elements */
    .glass-element {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      color: #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .glass-btn:active {
      transform: translateY(0);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(15, 18, 28, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; transition: background 0.3s ease; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
    .title { font-weight: 600; font-size: 1.05rem; letter-spacing: 0.4px; color: #ffffff; }

    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    /* Scrollable chat body */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message-wrapper { display: flex; flex-direction: column; gap: 6px; max-width: 90%; }
    .message-wrapper.user { align-self: flex-end; }
    .message-wrapper.assistant { align-self: flex-start; }

    .message {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }
    
    .message p { margin-bottom: 0.75rem; }
    .message p:last-child { margin-bottom: 0; }
    .message ol, .message ul { margin-left: 1.25rem; margin-bottom: 0.75rem; }
    .message li { margin-bottom: 0.4rem; }
    .message strong { color: #ffffff; font-weight: 600; }

    .message.user {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(79, 70, 229, 0.95));
      backdrop-filter: blur(10px);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .message.assistant {
      background: rgba(22, 27, 40, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d1d5db;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .message.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      font-size: 0.85rem;
      border: 1px solid rgba(239, 68, 68, 0.25);
      text-align: center;
      border-radius: 20px;
      padding: 8px 16px;
      backdrop-filter: blur(8px);
    }

    .attached-preview-img { max-width: 220px; border-radius: 10px; margin-bottom: 8px; display: block; border: 1px solid rgba(255,255,255,0.15); }
    .generated-img { width: 100%; max-width: 400px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); margin-top: 10px; cursor: pointer; display: block; }

    .msg-actions { display: flex; gap: 10px; align-items: center; padding-left: 4px; }
    .msg-action-btn {
      background: transparent;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      transition: color 0.2s ease;
    }
    .msg-action-btn:hover { color: #e5e7eb; }
    .msg-action-btn.liked { color: #10b981; }
    .msg-action-btn.disliked { color: #ef4444; }

    .thinking { align-self: flex-start; font-style: italic; color: #9ca3af; font-size: 0.88rem; display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
    .dots { display: inline-block; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 13, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      padding: 24px;
      overflow-y: auto;
    }
    .modal-overlay.active { display: block; }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h2 { font-size: 1.25rem; font-weight: 600; }

    .setting-group { margin-bottom: 20px; }
    .setting-group label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 8px; }
    .setting-group input, .setting-group select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f3f4f6;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
    }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .gallery-item { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.12); aspect-ratio: 1; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    footer {
      padding: 12px 16px;
      background: rgba(15, 18, 28, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    
    .input-bar { display: flex; gap: 8px; align-items: center; }
    .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
    
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f3f4f6;
      border-radius: 24px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
    }
    input[type="text"]:focus { border-color: rgba(99, 102, 241, 0.6); }
    
    .attachment-preview-bar {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .attachment-preview-bar.active { display: flex; }
    .attachment-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }

    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      flex-shrink: 0;
      font-size: 0.95rem;
    }

    /* Glass Live Mode Button Styling */
    .live-mode-btn {
      padding: 0 14px;
      height: 42px;
      border-radius: 21px;
      font-size: 0.85rem;
      font-weight: 600;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      flex-shrink: 0;
    }

    .live-mode-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: #10b981;
      animation: livePulse 1.8s infinite;
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div id="status-indicator" class="status-dot"></div>
      <span class="title">Bosompem AI</span>
    </div>
    <div class="header-actions">
      <button class="glass-btn icon-btn" onclick="toggleGallery()" title="Image Library">
        <i class="fa-regular fa-images"></i>
      </button>
      <button id="tts-toggle" class="glass-btn icon-btn" onclick="toggleAudio()" title="Toggle Speech">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button class="glass-btn icon-btn" onclick="toggleSettings()" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <main id="chat-container">
    <div class="message-wrapper assistant">
      <div class="message assistant">
        Welcome! I am <strong>Bosompem</strong>. Tap <i class="fa-solid fa-gear"></i> <strong>Settings</strong> to enter your Gemini API Key, or tap the <strong>LIVE</strong> button below to start talking live!
      </div>
    </div>
  </main>

  <div id="gallery-panel" class="modal-overlay">
    <div class="modal-header">
      <h2>Image Library</h2>
      <button class="glass-btn icon-btn" onclick="toggleGallery()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="gallery-container" class="gallery-grid">
      <p style="color: #9ca3af; grid-column: 1/-1;">No generated images saved yet.</p>
    </div>
  </div>

  <div id="settings-panel" class="modal-overlay">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="glass-btn icon-btn" onclick="toggleSettings()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="setting-group">
      <label for="api-key">Gemini API Key</label>
      <input type="text" id="api-key" placeholder="Paste your API key here" />
    </div>
    <div class="setting-group">
      <label for="model-select">Primary Model</label>
      <select id="model-select">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Recommended)</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Fastest)</option>
      </select>
    </div>
    <button class="glass-btn" style="width: 100%; padding: 12px; background: rgba(99, 102, 241, 0.4); border-color: rgba(99, 102, 241, 0.5); border-radius: 10px; font-weight: 600;" onclick="saveSettings()">Save Configuration</button>
  </div>

  <footer>
    <div id="attachment-preview" class="attachment-preview-bar">
      <img id="preview-thumb" class="attachment-thumb" src="" alt="preview" />
      <span style="font-size: 0.85rem; flex: 1; color: #d1d5db;" id="attachment-name">Image attached</span>
      <button class="glass-btn icon-btn" onclick="clearAttachment()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="input-bar">
      <input type="file" id="file-input" accept="image/*,.pdf,.txt" style="display: none;" onchange="handleFileSelected(event)" />
      
      <button class="glass-btn icon-btn" style="width: 42px; height: 42px; border-radius: 50%; color: #818cf8;" onclick="document.getElementById('file-input').click()" title="Upload File">
        <i class="fa-solid fa-paperclip"></i>
      </button>

      <!-- Live Voice Conversation Toggle Button -->
      <button id="live-btn" class="glass-btn live-mode-btn" onclick="toggleLiveMode()" title="Talk Live to AI">
        <i class="fa-solid fa-headset"></i>
        <span>LIVE</span>
      </button>

      <div class="input-wrapper">
        <input type="text" id="user-input" placeholder="Type a message or image prompt..." onkeypress="handleKeyPress(event)" />
      </div>

      <button id="mic-btn" class="glass-btn action-btn" onclick="toggleVoiceInput()" title="Voice Input">
        <i class="fa-solid fa-microphone"></i>
      </button>

      <button id="send-btn" class="glass-btn action-btn" style="background: rgba(99, 102, 241, 0.5); border-color: rgba(99, 102, 241, 0.6);" onclick="sendMessage()" title="Send">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
